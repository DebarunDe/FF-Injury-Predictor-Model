[project]
name = "ff-injury-predictor-model"
version = "0.1.0"
description = "Injury predictor microservice"
requires-python = ">=3.11"
dependencies = [
	"pandas==2.2.3",
	"numpy==2.1.3",
	"polars==1.17.1",
	"nflreadpy==0.1.5",
	"scikit-learn==1.5.2",
	"lightgbm==4.6.0",
	"xgboost==2.1.2",
	"imbalanced-learn==0.12.3",
	"flask==3.0.2",
	"gunicorn==23.0.0",
	"pydantic==2.9.2",
	"python-dotenv==1.0.1",
	"structlog==24.1.0",
	"matplotlib==3.9.2",
	"requests==2.32.3",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
